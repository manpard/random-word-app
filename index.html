  .card {
    width: 100%;

    background: var(--card);

    text-align: center;

    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 12px;

  .word {

  .example {

    margin: 0 0 32px;
  }
  button {

    font-weight: 600;
    padding: 12px 32px;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;

  button:active { transform: scale(0.97); }
  .actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
  }
  button.secondary {
    background: transparent;
    color: var(--accent);
    box-shadow: inset 0 0 0 2px var(--accent);
  }
  button.secondary:hover { background: rgba(59, 91, 219, 0.1); }
  button.secondary.speaking { background: var(--accent); color: #fff; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .deep {
    text-align: left;
    margin-top: 32px;
    border-top: 1px solid var(--line);
  }
  .deep[hidden] { display: none; }
  .section { padding-top: 24px; }
  .section h2 {
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 12px;
    font-weight: 600;
  }
  .detail { line-height: 1.65; margin: 0; }

  .build {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  .part {
    background: var(--soft);
    border-radius: 10px;
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .part b {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--accent);
  }
  .part span { font-size: 0.82rem; color: var(--muted); }
  .op { color: var(--muted); font-weight: 600; }
  .result {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.2rem;
    font-weight: 600;
  }

  .timeline {
    list-style: none;
    margin: 0;
    padding: 0;
    position: relative;
  }
  .timeline li {
    position: relative;
    padding: 0 0 16px 24px;
  }
  .timeline li:last-child { padding-bottom: 0; }
  .timeline li::before {
    content: "";
    position: absolute;
    left: 4px;
    top: 6px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
  }
  .timeline li:not(:last-child)::after {
    content: "";
    position: absolute;
    left: 8px;
    top: 18px;
    bottom: 0;
    width: 2px;
    background: var(--line);
  }
  .tl-when {
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--muted);
    display: block;
  }
  .tl-form {
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: 1.1rem;
  }
  .tl-gloss { color: var(--muted); }
  .tl-text { line-height: 1.55; display: block; margin-top: 2px; }

  .fade { animation: fade 0.35s ease; }
  @keyframes fade {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
</style>
</head>

  voracious: {
    detail: "Voracious describes a huge, eager appetite, for food or, figuratively, for books, knowledge or experiences.",
    parts: [["vor- (vorare)", "to devour, swallow"], ["-acious", "inclined to"]],
    lineage: [
      ["Latin", "vorare", "to devour"],
      ["Latin", "vorax", "greedy, ravenous"],
      ["English, 1630s", "voracious", ""],
    ],
    history: [
      ["1630s", "Used of predators and gluttons."],
      ["1700s", "“A voracious reader” becomes a common phrase."],
      ["Relatives", "Devour, carnivore, herbivore and omnivore."],
    ],
  },
};

const els = {
  content: document.getElementById("content"),
  word: document.getElementById("word"),
  pos: document.getElementById("pos"),
  meaning: document.getElementById("meaning"),
  example: document.getElementById("example"),
  deep: document.getElementById("deep"),
  detail: document.getElementById("detail"),
  build: document.getElementById("build"),
  lineage: document.getElementById("lineage"),
  history: document.getElementById("history"),
};

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}

function renderDetails(word) {
  const d = DETAILS[word];
  els.deep.hidden = !d;
  if (!d) return;

  els.detail.textContent = d.detail;

  // Building blocks: part + part = word
  els.build.replaceChildren();
  d.parts.forEach(([part, gloss], idx) => {
    if (idx > 0) els.build.append(el("span", "op", "+"));
    const chip = el("div", "part");
    chip.append(el("b", null, part), el("span", null, gloss));
    els.build.append(chip);
  });
  els.build.append(el("span", "op", "="), el("span", "result", word));

  // Lineage: language → form → gloss
  els.lineage.replaceChildren(...d.lineage.map(([lang, form, gloss]) => {
    const li = el("li");
    li.append(el("span", "tl-when", lang), el("span", "tl-form", form));
    if (gloss) li.append(el("span", "tl-gloss", ` — ${gloss}`));
    return li;
  }));

  // Historical usage
  els.history.replaceChildren(...d.history.map(([when, text]) => {
    const li = el("li");
    li.append(el("span", "tl-when", when), el("span", "tl-text", text));
    return li;
  }));
}

let lastIndex = -1;

function showRandomWord() {
  let i;
  do {
    i = Math.floor(Math.random() * WORDS.length);
  } while (i === lastIndex && WORDS.length > 1);
  lastIndex = i;

  const [word, pos, meaning, example] = WORDS[i];
  els.word.textContent = word;
  els.pos.textContent = pos;
  els.meaning.textContent = meaning;
  els.example.textContent = `“${example}”`;
  renderDetails(word);

  els.content.classList.remove("fade");
  void els.content.offsetWidth; // restart animation
  els.content.classList.add("fade");
}

const speakBtn = document.getElementById("speak");

function pickEnglishVoice() {
  const voices = speechSynthesis.getVoices();
  return (
    voices.find(v => v.lang === "en-US" && v.localService) ||
    voices.find(v => v.lang && v.lang.startsWith("en")) ||
    null
  );
}

function speakWord() {
  const word = els.word.textContent;
  if (!word) return;
  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(word);
  utterance.lang = "en-US";
  utterance.rate = 0.5; // slow, for learning pronunciation
  const voice = pickEnglishVoice();
  if (voice) utterance.voice = voice;

  utterance.onstart = () => speakBtn.classList.add("speaking");
  utterance.onend = utterance.onerror = () => speakBtn.classList.remove("speaking");
  speechSynthesis.speak(utterance);
}

if ("speechSynthesis" in window) {
  speakBtn.addEventListener("click", speakWord);
  speechSynthesis.getVoices(); // some browsers load voices lazily
} else {
  speakBtn.disabled = true;
  speakBtn.title = "Speech is not supported in this browser";
}

document.getElementById("refresh").addEventListener("click", () => {
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  showRandomWord();
});
showRandomWord();
</script>
</body>
</html>
